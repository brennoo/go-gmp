engines:
  lizard:
    exclude_paths:
      - "**/*_test.go"
      - "commands/filtering/options.go"
      - "commands/filtering/options_test.go"
      - "commands/getstatus_comprehensive_test.go"
      # Generated by internal/codegen; complexity tracks the GMP wire shape, not hand-tuned control flow.
      - "internal/codegen/testdata/golden/**"
      - "commands/get_info.go"
      - "commands/get_filters.go"
      - "commands/report_shared.go"
      - "commands/*_shared.go"
      # Declarative request-fixture registries; length tracks fixture count, not logic.
      - "internal/gmptest/cases_*.go"
      # Codegen entry points thread ~10 independent override tables by design (see overrides.go).
      - "internal/codegen/generate.go"
      - "internal/codegen/validate.go"
      - "internal/codegen/check.go"
      - "internal/codegen/overrides.go"
      - "internal/cmd/mirrorimages/mirrorimages.go"
  opengrep:
    exclude_paths:
      # Dev/build/test tooling: exec/file-I/O with fixed, non-attacker-controlled args, already `nolint:gosec`-reviewed.
      - "internal/cmd/gengmp/main_test.go"
      - "internal/cmd/mirrorimages/mirrorimages.go"
      - "internal/cmd/mirrorimages/mirrorimages_test.go"
      - "internal/cmd/schemadrift/schemadrift_test.go"
      - "internal/codegen/check.go"
      - "internal/codegen/check_test.go"
      - "internal/codegen/enum_test.go"
      - "internal/codegen/generate_test.go"
      - "internal/codegen/snapshot.go"
      - "internal/codegen/validate.go"
      - "internal/codegen/validate_test.go"
      - "internal/dockerstack/dockerstack.go"
      - "internal/gmptest/capture_test.go"
      - "internal/gmptest/fixture.go"
      - "internal/gmptest/golden_request_test.go"
      - "internal/gmptest/golden_response_test.go"
      - "internal/gmptest/transcribe_test.go"
      - "internal/gmptest/update_test.go"
      - "internal/mirror/mirror.go"
      - "internal/mirror/mirror_test.go"
      - "internal/schema/conform.go"
      - "internal/schema/parse.go"
      - "internal/schema/provenance_test.go"
      # Deliberately exercises insecure TLS configs to prove the client rejects/handles them; not production code.
      - "connections/conn_tls_test.go"
  trivy:
    exclude_paths:
      # Inert scaffolding module, never built or imported; see its own doc comment.
      - "internal/gmptest/testdata/upstream/**"
exclude_paths:
  - "examples/**"
