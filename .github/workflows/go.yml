name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-lint-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ hashFiles('**/go.sum') }}
      - name: Download dependencies
        # `go get` edits go.mod/go.sum and only targets the root package; this
        # is the reproducible, read-only equivalent.
        run: go mod download
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5
      - name: Build
        run: go build -v ./...
      - name: Test
        # The examples are excluded from coverage by .codacy.yaml, not here: the
        # previous `grep -v '^./examples'` matched nothing, since `go list ./...`
        # emits full module paths.
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go
