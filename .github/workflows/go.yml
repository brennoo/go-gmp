name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-lint-test-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fixture goldens under internal/gmptest/testdata pin byte-exact
        # encoding/xml output, so a toolchain bump that changes it should show
        # up as a failure on a specific Go version rather than a mystery.
        # Lint and the coverage upload only need to run once; they are gated
        # to the "stable" leg below.
        go-version: ["stable", "oldstable"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
      - name: Download dependencies
        # `go get` edits go.mod/go.sum and only targets the root package; this
        # is the reproducible, read-only equivalent.
        run: go mod download
      - name: Generated commands are not stale
        # commands/{create_note,modify_note,get_notes,note_shared}.go are
        # produced by hack/generate.sh from the committed schema snapshots in
        # internal/codegen/testdata/schema. Re-run the generator and fail if
        # the result differs from what is checked in — that catches a
        # hand-edit of a generated file, or a snapshot edit that was never
        # followed by a regeneration.
        #
        # This is Stage B of the T-9 pipeline only, so it needs no AGPL input:
        # Stage A (schema extraction from vendor/XML, which is gitignored and
        # never fetched in CI) already ran on a developer's machine to produce
        # those committed JSON snapshots. Stage B reads nothing but them.
        #
        # Gated to one matrix leg, like Lint and the coverage upload: the
        # generator is deterministic and toolchain-independent, so running it
        # twice would only cost time.
        if: matrix.go-version == 'stable'
        run: |
          go run ./internal/cmd/gengmp -schema internal/codegen/testdata/schema -out ./commands
          # `git add -N` records the intent to add, so a generated file that
          # was deleted from the repo (and therefore comes back untracked)
          # shows up in `git diff` rather than passing silently.
          git add -N -- \
            commands/create_note.go \
            commands/modify_note.go \
            commands/get_notes.go \
            commands/note_shared.go
          git diff --exit-code -- \
            commands/create_note.go \
            commands/modify_note.go \
            commands/get_notes.go \
            commands/note_shared.go
      - name: Lint
        if: matrix.go-version == 'stable'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5
      - name: Build
        run: go build -v ./...
      - name: Build (integration tag)
        # `go build ./...` never compiles a `//go:build integration` file, so
        # without this step internal/gmptest/live.go and live_test.go could
        # bit-rot for months between the rare manual runs of the live suite
        # itself and nobody would notice in CI.
        run: go build -tags integration -v ./...
      - name: Vet (integration tag)
        run: go vet -tags integration ./...
      - name: Test
        # The examples are excluded from coverage by .codacy.yaml, not here: the
        # previous `grep -v '^./examples'` matched nothing, since `go list ./...`
        # emits full module paths.
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage to Codacy
        if: matrix.go-version == 'stable'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go
