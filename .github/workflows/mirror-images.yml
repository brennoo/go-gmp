name: Mirror images

# GitHub disables `schedule:` triggers after 60 days of no repository
# activity — a quiet period silently stops this job and nothing notifies
# anyone. workflow_dispatch is here so the mirror can always be refreshed by
# hand regardless of whether the schedule is currently alive.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# This job holds packages: write, unlike this repo's other workflows — every
# action reference here is pinned to a commit SHA (not just third-party
# ones) so that elevated permission can't be exercised by a moved tag.

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror images
        run: hack/mirror-images.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-mirror-lock
          path: hack/image-mirror.lock.json

      # Purely informational: this job never commits. A human reviews the
      # uploaded lock file above and opens a PR if it changed.
      - name: Report lock file drift
        if: always()
        run: git diff --stat -- hack/image-mirror.lock.json
