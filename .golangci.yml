version: "2"
run:
  go: "1.23"
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
  # Without this, every file behind `//go:build integration` (internal/gmptest/live.go,
  # live_test.go) is invisible to the linter: golangci-lint builds the package the same
  # way `go build` would, and a plain build never sees a tagged file either.
  build-tags:
    - integration
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - errname
    - errorlint
    - gocyclo
    - godot
    - gosec
    - govet
    - misspell
    - nilerr
    - staticcheck
    - tparallel
    - unparam
    - unused
    - whitespace
    - noctx
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gosec
          - testinggoroutine
        path: _test\.go
      - linters:
          - dupl
        path: commands/pagination/.*\.go
      - linters:
          - dupl
        path: internal/gmptest/(registry|cases_.*)\.go
      - linters:
          - dupl
          - errcheck
          - unparam
        path: examples/
    paths:
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
